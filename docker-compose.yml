services:
  boxofficereporting:
    image: projectfaust/box-office-reporting:latest
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "https://+:8081;http://+:8080"
      ASPNETCORE_HTTPS_PORTS: "8081"

      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: "${HTTPS_CERT_PASSWORD}"

      Authentication__Google__ClientId: "${GOOGLE_CLIENT_ID}"
      Authentication__Google__ClientSecret: "${GOOGLE_CLIENT_SECRET}"

      ConnectionStrings__DefaultConnection: "Data Source=/app/data/app.db"
    volumes:
      - ./keys:/app/keys
      - ./data:/app/data
      - ${HTTPS_CERT_DIR}:/https:ro
